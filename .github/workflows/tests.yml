name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install optiprop and development dependencies
        run: python -m pip install ".[dev]"

      - name: Verify installed CPU package, entry points, and bundled assets
        # Run outside the checkout so source files cannot hide missing wheel data.
        working-directory: ${{ runner.temp }}
        shell: python
        run: |
          import importlib.metadata as metadata
          import importlib.resources as resources
          import sys

          qt_prefixes = ("pyside", "pyqt", "qtpy", "shiboken")
          installed = {dist.metadata["Name"].lower() for dist in metadata.distributions()}
          assert not any(name.startswith(qt_prefixes) for name in installed), installed
          requirements = metadata.requires("optiprop") or []
          assert not any(req.lower().startswith(qt_prefixes) for req in requirements), requirements

          import torch
          import optiprop
          import optiprop.gui.app
          import optiprop.workbench.app

          assert torch.version.cuda is None, "CI must use the CPU PyTorch build"
          assert optiprop.__version__ == metadata.version("optiprop") == "1.0.8"
          scripts = {
              ep.name: ep for ep in metadata.distribution("optiprop").entry_points
              if ep.group == "console_scripts"
          }
          assert scripts["optiprop-workbench"].value == "optiprop.workbench.app:main"
          assert scripts["optiprop-gui"].value == "optiprop.gui.app:main"
          assert scripts["optiprop-workbench"].load() is optiprop.workbench.app.main
          assert scripts["optiprop-gui"].load() is optiprop.gui.app.main

          package = resources.files("optiprop.workbench")
          assets = list(package.joinpath("static").iterdir())
          for suffix in (".html", ".css", ".js"):
              assert any(asset.name.endswith(suffix) and asset.read_bytes() for asset in assets), suffix
          for name in (
              "free_propagation.json", "laser_collimator_demo.json",
              "metalens_focus_ideal.json", "metalens_focus_binary2.json",
          ):
              assert package.joinpath("examples").joinpath(name).read_bytes(), name
          assert not any(name.lower().startswith(qt_prefixes) for name in sys.modules)

      - name: Run test suite with Qt imports forbidden
        shell: python
        run: |
          import importlib.abc
          import sys

          qt_roots = {"PySide2", "PySide6", "PyQt5", "PyQt6", "qtpy", "shiboken2", "shiboken6"}
          attempts = []

          class NoQtImports(importlib.abc.MetaPathFinder):
              def find_spec(self, fullname, path=None, target=None):
                  if fullname.split(".")[0] in qt_roots:
                      attempts.append(fullname)
                      raise AssertionError(f"Qt import is forbidden in CI: {fullname}")

          sys.meta_path.insert(0, NoQtImports())
          import pytest

          result = pytest.main(["tests"])
          assert not attempts, attempts
          assert not any(name.split(".")[0] in qt_roots for name in sys.modules)
          raise SystemExit(result)
